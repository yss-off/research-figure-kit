[project]
name = "academic-figure-skills"
version = "0.3.3"
description = "Self-contained Codex plugin for publication diagrams and scientific data figures"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[tool.academic_figure_skills]
offline = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.academic_figure_skills.plugin]
name = "academic-figure-skills"
path = "plugins/academic-figure-skills"
version = "0.3.3"
marketplace_path = ".agents/plugins/marketplace.json"

[[tool.academic_figure_skills.skills]]
name = "drawio"
path = "plugins/academic-figure-skills/skills/drawio"
version = "2.7.0"
kind = "drawio-base"
source_url = "https://github.com/bahayonghang/drawio-skills"
source_commit = "27dac02ce3b4901c844aaa623ad64c3d577c3a72"

[[tool.academic_figure_skills.skills]]
name = "drawio-academic-skills"
path = "plugins/academic-figure-skills/skills/drawio-academic-skills"
version = "0.1.2"
kind = "drawio-overlay"
base_skill_name = "drawio"

[[tool.academic_figure_skills.skills]]
name = "scientific-visualization"
path = "plugins/academic-figure-skills/skills/scientific-visualization"
version = "1.2.1"
kind = "scientific-plotting"
